name: Build Culture du Quebec APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run non regression tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace
      - name: Create source ZIP
        run: git archive --format=zip --output=Culture-du-Quebec-Source-3.6.1.zip HEAD
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Culture-du-Quebec-3.6.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Culture-du-Quebec-3.6.1-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload source backup
        uses: actions/upload-artifact@v4
        with:
          name: Culture-du-Quebec-Source-3.6.1
          path: Culture-du-Quebec-Source-3.6.1.zip
          if-no-files-found: error
