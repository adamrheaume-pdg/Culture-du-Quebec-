<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{height:100%;margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#dfe8ee;-webkit-user-select:none;user-select:none}#map{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:#dfe8ee}.tiles,.markers{position:absolute;left:0;top:0;width:100%;height:100%}.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;pointer-events:none}.marker{position:absolute;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px #0007;transform:translate(-50%,-50%);z-index:20;touch-action:none}.pulse-b{animation:pulseB 1.35s infinite}.pulse-g{animation:pulseG 1.35s infinite}.pulse-r{animation:pulseR 1.15s infinite}@keyframes pulseB{0%,100%{box-shadow:0 0 0 0 rgba(11,107,179,.65)}50%{box-shadow:0 0 0 11px rgba(11,107,179,.12)}}@keyframes pulseG{0%,100%{box-shadow:0 0 0 0 rgba(23,132,71,.65)}50%{box-shadow:0 0 0 11px rgba(23,132,71,.12)}}@keyframes pulseR{0%,100%{box-shadow:0 0 0 0 rgba(214,47,47,.65)}50%{box-shadow:0 0 0 11px rgba(214,47,47,.12)}}.ctrl{position:absolute;z-index:50;background:#fff;border:0;border-radius:11px;box-shadow:0 1px 7px #5557;color:#064f89;font-weight:700;touch-action:manipulation}.reset{right:10px;top:10px;padding:12px 14px}.zoom{left:10px;top:10px;display:flex;flex-direction:column;overflow:hidden}.zoom button{width:50px;height:50px;border:0;background:#fff;color:#064f89;font-size:29px;font-weight:700;touch-action:manipulation}.legend{position:absolute;z-index:55;left:8px;bottom:22px;background:rgba(255,255,255,.97);padding:9px 10px;border-radius:12px;font-size:11px;line-height:1.35;box-shadow:0 2px 10px #0002;max-width:220px;touch-action:manipulation}.legend-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}.legend-actions{display:flex;gap:4px}.legend-actions button{border:1px solid #a8bfd0;background:#eef6fb;color:#064f89;border-radius:6px;padding:3px 6px;font-size:10px;font-weight:700}.legend-row{display:flex;align-items:center;gap:4px;border:0;background:transparent;width:100%;padding:2px 0;text-align:left;font-size:11px;color:#172536}.legend-row.off{opacity:.38;text-decoration:line-through}.legend-row .check{margin-left:auto;font-weight:700;color:#0a6}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:2px;border:2px solid #fff;box-shadow:0 0 0 1px #bbb}.b{background:#0b6bb3}.g{background:#178447}.r{background:#d62f2f}.o{background:#e07a18}.p{background:#7a46a8}.legend-count{border-top:1px solid #d9e1e6;margin-top:4px;padding-top:4px;font-size:10px;color:#52606c}.popup{position:absolute;z-index:60;background:#fff;border-radius:14px;padding:12px 14px;min-width:210px;max-width:78%;box-shadow:0 3px 16px #0006;font-size:14px;display:none}.go{display:inline-block;margin-top:7px;background:#064f89;color:white!important;padding:8px 11px;border-radius:8px;text-decoration:none}.attrib{position:absolute;z-index:40;right:4px;bottom:2px;background:#fffd;font-size:10px;pointer-events:none}</style></head><body><div id="map"><div class="tiles" id="tiles"></div><div class="markers" id="markers"></div><div class="zoom ctrl"><button id="zin">+</button><button id="zout">−</button></div><button class="reset ctrl" id="reset">Québec</button><div class="legend" id="legend"><div class="legend-title"><b>Légende / filtres</b><div class="legend-actions"><button id="allOn">Tout</button><button id="allOff">Aucun</button></div></div><button class="legend-row" data-key="culture"><span class="dot b"></span>Culture<span class="check">✓</span></button><button class="legend-row" data-key="music"><span class="dot b pulse-b"></span>Musique<span class="check">✓</span></button><button class="legend-row" data-key="theatre"><span class="dot g"></span>Théâtre<span class="check">✓</span></button><button class="legend-row" data-key="screen"><span class="dot g pulse-g"></span>Film / TV / Web<span class="check">✓</span></button><button class="legend-row" data-key="heritage"><span class="dot r pulse-r"></span>Patrimoine / histoire<span class="check">✓</span></button><button class="legend-row" data-key="indigenous"><span class="dot r"></span>Autochtone<span class="check">✓</span></button><button class="legend-row" data-key="book"><span class="dot p"></span>Livre / littérature<span class="check">✓</span></button><button class="legend-row" data-key="other"><span class="dot o"></span>Autre événement<span class="check">✓</span></button><div class="legend-count" id="legendCount">Tous les points affichés</div></div><div class="popup" id="popup"></div><div class="attrib">© OpenStreetMap</div></div><script>const map=document.getElementById('map'),tiles=document.getElementById('tiles'),markersEl=document.getElementById('markers'),popup=document.getElementById('popup'),legendCount=document.getElementById('legendCount');let zoom=5,center={lat:52.2,lon:-71.4},items=[];const TILE=256,MIN_Z=3,MAX_Z=18,pointers=new Map(),allKeys=['culture','music','theatre','screen','heritage','indigenous','book','other'];let enabled=new Set(allKeys),dragLast=null,pinchStart=null,lastTap=0;function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function world(lat,lon,z){const n=Math.pow(2,z)*TILE,x=(lon+180)/360*n,s=Math.sin(clamp(lat,-85,85)*Math.PI/180),y=(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n;return{x,y}}function unworld(x,y,z){const n=Math.pow(2,z)*TILE,lon=x/n*360-180,yy=.5-y/n,lat=90-360*Math.atan(Math.exp(-yy*2*Math.PI))/Math.PI;return{lat,lon}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function has(s,w){return w.some(x=>s.includes(x))}function cat(x){const s=(String(x.title||'')+' '+String(x.type||'')+' '+String(x.theme||'')+' '+String(x.desc||'')+' '+String(x.place||'')+' '+String(x.source||'')).toLowerCase();if(has(s,['autocht','inuit','innu','atikamekw','anichin','mohawk','kanien','mi’gmaq',"mi'gmaq",'wendat','naskapi','eeyou','wolastoq','abéna']))return{key:'indigenous',fill:'#d62f2f',cls:'',label:'Autochtone'};if(has(s,['patrimoine','historique','histoire','archéolog','archeolog','lieu historique','site historique','site patrimonial','immeuble patrimonial']))return{key:'heritage',fill:'#d62f2f',cls:'pulse-r',label:'Patrimoine / histoire'};if(has(s,['film','cinéma','cinema','télévision','television','série','serie','web','numérique','numerique']))return{key:'screen',fill:'#178447',cls:'pulse-g',label:'Film / TV / Web'};if(has(s,['théâtre','theatre','scène','scene']))return{key:'theatre',fill:'#178447',cls:'',label:'Théâtre'};if(has(s,['musique','concert','chanson','jazz','rock','rap','hip-hop','folk']))return{key:'music',fill:'#0b6bb3',cls:'pulse-b',label:'Musique'};if(has(s,['livre','littérature','litterature','auteur','poésie','roman','bibliothèque']))return{key:'book',fill:'#7a46a8',cls:'',label:'Livre / littérature'};if(has(s,['culture','musée','musee','exposition','art','galerie','festival']))return{key:'culture',fill:'#0b6bb3',cls:'',label:'Culture'};return{key:'other',fill:'#e07a18',cls:'',label:'Autre événement'}}function activeItems(){return items.filter(x=>enabled.has(cat(x).key))}function updateLegend(){document.querySelectorAll('.legend-row').forEach(r=>{const on=enabled.has(r.dataset.key);r.classList.toggle('off',!on);const c=r.querySelector('.check');if(c)c.textContent=on?'✓':'○'});const visible=activeItems().length;legendCount.textContent=visible+' / '+items.length+' point(s) affiché(s)'}function render(){const w=map.clientWidth,h=map.clientHeight,cw=world(center.lat,center.lon,zoom),left=cw.x-w/2,top=cw.y-h/2;tiles.innerHTML='';const max=Math.pow(2,zoom),x0=Math.floor(left/TILE),x1=Math.floor((left+w)/TILE),y0=Math.floor(top/TILE),y1=Math.floor((top+h)/TILE);for(let ty=y0;ty<=y1;ty++){if(ty<0||ty>=max)continue;for(let tx=x0;tx<=x1;tx++){const wx=((tx%max)+max)%max,im=document.createElement('img');im.className='tile';im.src='https://tile.openstreetmap.org/'+zoom+'/'+wx+'/'+ty+'.png';im.style.left=(tx*TILE-left)+'px';im.style.top=(ty*TILE-top)+'px';tiles.appendChild(im)}}markersEl.innerHTML='';activeItems().forEach(x=>{const p=world(+x.lat,+x.lon,zoom),sx=p.x-left,sy=p.y-top;if(sx<-35||sy<-35||sx>w+35||sy>h+35)return;const c=cat(x),m=document.createElement('button');m.className='marker '+c.cls;m.style.background=c.fill;m.style.left=sx+'px';m.style.top=sy+'px';m.setAttribute('aria-label',c.label+' : '+String(x.title||''));m.onclick=e=>{e.stopPropagation();popup.innerHTML='<b>'+esc(x.title)+'</b><br>'+esc(c.label)+(x.date?'<br>📅 '+esc(x.date):'')+(x.place?'<br>📍 '+esc(x.place):'')+(x.source?'<br><small>Source : '+esc(x.source)+'</small>':'')+(x.url?'<br><a class="go" href="'+esc(x.url)+'">PLUS D’INFO</a>':'');popup.style.left=clamp(sx,120,w-120)+'px';popup.style.top=clamp(sy,120,h-40)+'px';popup.style.display='block'};markersEl.appendChild(m)});updateLegend()}function panBy(dx,dy){const c=world(center.lat,center.lon,zoom),n=unworld(c.x-dx,c.y-dy,zoom);center={lat:clamp(n.lat,-85,85),lon:n.lon};render()}function zoomAt(delta,cx,cy){const old=zoom,nz=clamp(old+delta,MIN_Z,MAX_Z);if(nz===old)return;const w=map.clientWidth,h=map.clientHeight,oldCenter=world(center.lat,center.lon,old),anchorWorld={x:oldCenter.x+(cx-w/2),y:oldCenter.y+(cy-h/2)},anchorGeo=unworld(anchorWorld.x,anchorWorld.y,old);zoom=nz;const newAnchor=world(anchorGeo.lat,anchorGeo.lon,zoom),newCenterWorld={x:newAnchor.x-(cx-w/2),y:newAnchor.y-(cy-h/2)},newCenter=unworld(newCenterWorld.x,newCenterWorld.y,zoom);center={lat:clamp(newCenter.lat,-85,85),lon:newCenter.lon};render()}function z(d){zoomAt(d,map.clientWidth/2,map.clientHeight/2)}function fit(){const src=activeItems();if(!src.length){zoom=5;center={lat:52.2,lon:-71.4};render();return}let minLat=90,maxLat=-90,minLon=180,maxLon=-180;src.forEach(x=>{minLat=Math.min(minLat,+x.lat);maxLat=Math.max(maxLat,+x.lat);minLon=Math.min(minLon,+x.lon);maxLon=Math.max(maxLon,+x.lon)});center={lat:(minLat+maxLat)/2,lon:(minLon+maxLon)/2};zoom=5;render()}window.setCultureMarkers=a=>{items=(a||[]).filter(x=>Number.isFinite(+x.lat)&&Number.isFinite(+x.lon));enabled=new Set(allKeys);updateLegend();fit()};function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}document.querySelectorAll('.legend-row').forEach(r=>r.addEventListener('click',e=>{e.stopPropagation();const k=r.dataset.key;if(enabled.has(k))enabled.delete(k);else enabled.add(k);popup.style.display='none';render()}));document.getElementById('allOn').onclick=e=>{e.stopPropagation();enabled=new Set(allKeys);render()};document.getElementById('allOff').onclick=e=>{e.stopPropagation();enabled.clear();popup.style.display='none';render()};document.getElementById('legend').addEventListener('pointerdown',e=>e.stopPropagation());map.addEventListener('pointerdown',e=>{if(e.target.closest('.ctrl')||e.target.closest('.marker')||e.target.closest('.popup')||e.target.closest('.legend'))return;map.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});popup.style.display='none';if(pointers.size===1){dragLast={x:e.clientX,y:e.clientY};pinchStart=null}else if(pointers.size===2){const [a,b]=[...pointers.values()];pinchStart={distance:Math.max(1,dist(a,b)),zoom,mid:mid(a,b)};dragLast=null}e.preventDefault()},{passive:false});map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&dragLast){const dx=e.clientX-dragLast.x,dy=e.clientY-dragLast.y;dragLast={x:e.clientX,y:e.clientY};if(Math.abs(dx)+Math.abs(dy)>0)panBy(dx,dy)}else if(pointers.size>=2){const [a,b]=[...pointers.values()],m=mid(a,b),d=Math.max(1,dist(a,b));if(!pinchStart)pinchStart={distance:d,zoom,mid:m};const scale=d/pinchStart.distance;let target=clamp(Math.round(pinchStart.zoom+Math.log2(scale)),MIN_Z,MAX_Z);if(target!==zoom)zoomAt(target-zoom,m.x,m.y);const mdx=m.x-pinchStart.mid.x,mdy=m.y-pinchStart.mid.y;if(Math.abs(mdx)+Math.abs(mdy)>2){panBy(mdx,mdy);pinchStart.mid=m}}e.preventDefault()},{passive:false});function endPointer(e){pointers.delete(e.pointerId);if(pointers.size===1){const p=[...pointers.values()][0];dragLast={x:p.x,y:p.y};pinchStart=null}else{dragLast=null;pinchStart=null}}map.addEventListener('pointerup',endPointer);map.addEventListener('pointercancel',endPointer);map.addEventListener('dblclick',e=>{zoomAt(1,e.clientX,e.clientY);e.preventDefault()});map.addEventListener('touchend',e=>{if(e.touches.length)return;const now=Date.now();if(now-lastTap<280){const t=e.changedTouches&&e.changedTouches[0];if(t)zoomAt(1,t.clientX,t.clientY);lastTap=0}else lastTap=now},{passive:false});document.getElementById('zin').onclick=e=>{e.stopPropagation();z(1)};document.getElementById('zout').onclick=e=>{e.stopPropagation();z(-1)};document.getElementById('reset').onclick=e=>{e.stopPropagation();fit()};window.addEventListener('resize',render);updateLegend();render();</script></body></html>
