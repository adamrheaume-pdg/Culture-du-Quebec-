<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{height:100%;margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#dfe8ee}#map{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:#dfe8ee}.tiles,.markers{position:absolute;left:0;top:0;width:100%;height:100%}.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}.marker{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px #0007;transform:translate(-50%,-50%);z-index:20}.pulse-b{animation:pulseB 1.35s infinite}.pulse-g{animation:pulseG 1.35s infinite}.pulse-r{animation:pulseR 1.15s infinite}@keyframes pulseB{0%,100%{box-shadow:0 0 0 0 rgba(11,107,179,.65)}50%{box-shadow:0 0 0 11px rgba(11,107,179,.12)}}@keyframes pulseG{0%,100%{box-shadow:0 0 0 0 rgba(23,132,71,.65)}50%{box-shadow:0 0 0 11px rgba(23,132,71,.12)}}@keyframes pulseR{0%,100%{box-shadow:0 0 0 0 rgba(214,47,47,.65)}50%{box-shadow:0 0 0 11px rgba(214,47,47,.12)}}.ctrl{position:absolute;z-index:50;background:#fff;border:0;border-radius:11px;box-shadow:0 1px 7px #5557;color:#064f89;font-weight:700}.reset{right:10px;top:10px;padding:12px 14px}.zoom{left:10px;top:10px;display:flex;flex-direction:column;overflow:hidden}.zoom button{width:46px;height:46px;border:0;background:#fff;color:#064f89;font-size:27px;font-weight:700}.legend{position:absolute;z-index:45;left:8px;bottom:22px;background:rgba(255,255,255,.95);padding:8px 10px;border-radius:10px;font-size:11px;line-height:1.55}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:5px;border:2px solid #fff}.b{background:#0b6bb3}.g{background:#178447}.r{background:#d62f2f}.o{background:#e07a18}.p{background:#7a46a8}.popup{position:absolute;z-index:60;background:#fff;border-radius:14px;padding:12px 14px;min-width:210px;max-width:78%;box-shadow:0 3px 16px #0006;font-size:14px;display:none}.go{display:inline-block;margin-top:7px;background:#064f89;color:white!important;padding:8px 11px;border-radius:8px;text-decoration:none}.attrib{position:absolute;z-index:40;right:4px;bottom:2px;background:#fffd;font-size:10px}</style></head><body><div id="map"><div class="tiles" id="tiles"></div><div class="markers" id="markers"></div><div class="zoom ctrl"><button id="zin">+</button><button id="zout">−</button></div><button class="reset ctrl" id="reset">Québec</button><div class="legend"><b>Légende</b><br><span class="dot b"></span>Culture<br><span class="dot b pulse-b"></span>Musique<br><span class="dot g"></span>Théâtre<br><span class="dot g pulse-g"></span>Film / TV / Web<br><span class="dot r pulse-r"></span>Patrimoine / histoire<br><span class="dot r"></span>Autochtone<br><span class="dot p"></span>Livre / littérature<br><span class="dot o"></span>Autre événement</div><div class="popup" id="popup"></div><div class="attrib">© OpenStreetMap</div></div><script>const map=document.getElementById('map'),tiles=document.getElementById('tiles'),markersEl=document.getElementById('markers'),popup=document.getElementById('popup');let zoom=5,center={lat:52.2,lon:-71.4},items=[],drag=null;const TILE=256;function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function world(lat,lon,z){const n=Math.pow(2,z)*TILE,x=(lon+180)/360*n,s=Math.sin(lat*Math.PI/180),y=(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n;return{x,y}}function unworld(x,y,z){const n=Math.pow(2,z)*TILE,lon=x/n*360-180,yy=.5-y/n,lat=90-360*Math.atan(Math.exp(-yy*2*Math.PI))/Math.PI;return{lat,lon}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function has(s,w){return w.some(x=>s.includes(x))}function cat(x){const s=(String(x.title||'')+' '+String(x.type||'')+' '+String(x.theme||'')+' '+String(x.desc||'')+' '+String(x.place||'')).toLowerCase();if(has(s,['autocht','inuit','innu','atikamekw','anichin','mohawk','kanien','mi’gmaq',"mi'gmaq",'wendat','naskapi','eeyou','wolastoq','abéna']))return{fill:'#d62f2f',cls:'',label:'Autochtone'};if(has(s,['patrimoine','historique','histoire','archéolog','archeolog']))return{fill:'#d62f2f',cls:'pulse-r',label:'Patrimoine / histoire'};if(has(s,['film','cinéma','cinema','télévision','television','série','serie','web','numérique','numerique']))return{fill:'#178447',cls:'pulse-g',label:'Film / TV / Web'};if(has(s,['théâtre','theatre','scène','scene']))return{fill:'#178447',cls:'',label:'Théâtre'};if(has(s,['musique','concert','chanson','jazz','rock','rap','hip-hop','folk']))return{fill:'#0b6bb3',cls:'pulse-b',label:'Musique'};if(has(s,['livre','littérature','litterature','auteur','poésie','roman','bibliothèque']))return{fill:'#7a46a8',cls:'',label:'Livre / littérature'};if(has(s,['culture','musée','musee','exposition','art','galerie','festival']))return{fill:'#0b6bb3',cls:'',label:'Culture'};return{fill:'#e07a18',cls:'',label:'Autre événement'}}function render(){const w=map.clientWidth,h=map.clientHeight,cw=world(center.lat,center.lon,zoom),left=cw.x-w/2,top=cw.y-h/2;tiles.innerHTML='';const max=Math.pow(2,zoom),x0=Math.floor(left/TILE),x1=Math.floor((left+w)/TILE),y0=Math.floor(top/TILE),y1=Math.floor((top+h)/TILE);for(let ty=y0;ty<=y1;ty++){if(ty<0||ty>=max)continue;for(let tx=x0;tx<=x1;tx++){const wx=((tx%max)+max)%max,im=document.createElement('img');im.className='tile';im.src='https://tile.openstreetmap.org/'+zoom+'/'+wx+'/'+ty+'.png';im.style.left=(tx*TILE-left)+'px';im.style.top=(ty*TILE-top)+'px';tiles.appendChild(im)}}markersEl.innerHTML='';items.forEach(x=>{const p=world(+x.lat,+x.lon,zoom),sx=p.x-left,sy=p.y-top;if(sx<-30||sy<-30||sx>w+30||sy>h+30)return;const c=cat(x),m=document.createElement('button');m.className='marker '+c.cls;m.style.background=c.fill;m.style.left=sx+'px';m.style.top=sy+'px';m.onclick=e=>{e.stopPropagation();popup.innerHTML='<b>'+esc(x.title)+'</b><br>'+esc(c.label)+(x.date?'<br>📅 '+esc(x.date):'')+(x.place?'<br>📍 '+esc(x.place):'')+(x.source?'<br><small>Source : '+esc(x.source)+'</small>':'')+(x.url?'<br><a class="go" href="'+esc(x.url)+'">PLUS D’INFO</a>':'');popup.style.left=clamp(sx,120,w-120)+'px';popup.style.top=clamp(sy,120,h-40)+'px';popup.style.display='block'};markersEl.appendChild(m)})}function setCenterFromPixel(dx,dy){const c=world(center.lat,center.lon,zoom),n=unworld(c.x-dx,c.y-dy,zoom);center={lat:clamp(n.lat,-85,85),lon:n.lon};render()}function z(d){zoom=clamp(zoom+d,3,18);render()}function fit(){if(!items.length){zoom=5;center={lat:52.2,lon:-71.4};render();return}let minLat=90,maxLat=-90,minLon=180,maxLon=-180;items.forEach(x=>{minLat=Math.min(minLat,+x.lat);maxLat=Math.max(maxLat,+x.lat);minLon=Math.min(minLon,+x.lon);maxLon=Math.max(maxLon,+x.lon)});center={lat:(minLat+maxLat)/2,lon:(minLon+maxLon)/2};zoom=5;render()}window.setCultureMarkers=a=>{items=(a||[]).filter(x=>Number.isFinite(+x.lat)&&Number.isFinite(+x.lon));fit()};map.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};popup.style.display='none'});map.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;setCenterFromPixel(dx,dy)}});map.addEventListener('pointerup',()=>drag=null);map.addEventListener('dblclick',()=>z(1));document.getElementById('zin').onclick=()=>z(1);document.getElementById('zout').onclick=()=>z(-1);document.getElementById('reset').onclick=fit;window.addEventListener('resize',render);render();</script></body></html>
